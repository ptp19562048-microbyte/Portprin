<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131e">
<title>Portprin OS</title>
<style>
:root{
  --accent:#a391ff;
  --muted:#aeb5ca;
  --app-height:100vh;
  --app-top:0px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#f4f5fb;
  background:#10131e;
}
@supports (height: 100dvh) {
  :root { --app-height:100dvh; }
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{min-height:var(--app-height);min-height:-webkit-fill-available;background:#10131e}
button,input,textarea,select{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px}
#desktop{
  position:fixed;
  inset:0;
  width:100vw;
  height:var(--app-height);
  height:-webkit-fill-available;
  overflow:hidden;
  background:radial-gradient(ellipse at 75% 15%,#6872bd 0,transparent 36%),radial-gradient(ellipse at 12% 84%,#245c78 0,transparent 43%),linear-gradient(135deg,#15192b,#27304e 55%,#161d32)
}
#desktop.aurora{background:radial-gradient(ellipse at 75% 12%,#bd8de5,transparent 35%),radial-gradient(ellipse at 12% 80%,#257e87,transparent 43%),linear-gradient(135deg,#17152d,#293858 55%,#171d34)}
#desktop.sunset{background:radial-gradient(ellipse at 76% 18%,#faad78,transparent 36%),radial-gradient(ellipse at 10% 85%,#a54b78,transparent 48%),linear-gradient(135deg,#362042,#593957 60%,#22203c)}
#boot{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#242544,#111522 55%,#090c13);transition:opacity .5s,visibility .5s}
.boot-inner{width:min(380px,84vw);text-align:center}.brand{width:66px;height:66px;margin:0 auto 23px;display:grid;place-items:center;border:1px solid #ffffff36;border-radius:22px;background:linear-gradient(145deg,#b2a5ff,#6654d9)}.brand svg{width:36px;height:36px}.boot-title{font-size:clamp(20px,4vw,27px);font-weight:680}.boot-sub{margin:10px 0 25px;color:#aab1c9}.progress{height:4px;overflow:hidden;border-radius:9px;background:#ffffff20}.progress i{display:block;width:0;height:100%;background:#b4a7ff;animation:load 5s linear forwards}.boot-status{margin-top:11px;color:#929ab4;font-size:12px}@keyframes load{to{width:100%}}#boot.done{opacity:0;visibility:hidden;pointer-events:none}
.topbar{position:absolute;z-index:5;inset:0 0 auto;height:calc(42px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-left)) 0;display:flex;align-items:center;justify-content:space-between;background:#10152466;backdrop-filter:blur(16px);font-size:13px}.topbar button{border:0;background:none;color:white;padding:6px}.top-right{display:flex;gap:12px;align-items:center}.desktop-icons{position:absolute;top:58px;left:15px;bottom:75px;display:grid;grid-template-columns:76px;grid-auto-rows:80px;gap:5px}.desktop-icon{width:72px;padding:7px 3px;border:1px solid transparent;border-radius:12px;background:transparent;color:#fff;text-align:center;text-shadow:0 1px 5px #0009}.desktop-icon:hover{background:#ffffff20}.icon-tile{width:43px;height:43px;margin:0 auto 5px;display:grid;place-items:center;border:1px solid #ffffff25;border-radius:14px;background:#ffffff20}.desktop-icon span:last-child{font-size:11px}.welcome{position:absolute;right:7vw;top:24%;max-width:480px;text-align:right;pointer-events:none;text-shadow:0 3px 20px #0004}.welcome h1{margin:0 0 12px;font-size:clamp(38px,6vw,72px);line-height:1;letter-spacing:-.055em}.welcome p{margin:0;color:#e0e5f7}.welcome time{display:block;margin-top:18px;color:#d0d7ed;font-size:14px}
.taskbar{position:absolute;z-index:8;inset:auto 0 0;height:calc(62px + env(safe-area-inset-bottom));padding:0 150px env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;gap:7px;background:#111626c4;backdrop-filter:blur(20px);border-top:1px solid #ffffff1b}.dock-button{width:42px;height:42px;flex:none;display:grid;place-items:center;border:0;border-radius:13px;background:#ffffff12}.dock-button:hover{background:#ffffff27}.dock-button.start{background:var(--accent);font-weight:800}.separator{height:27px;width:1px;background:#ffffff30}.dock-apps{display:flex;gap:5px}.tray{position:absolute;right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;gap:5px;font-size:12px}.tray button{width:28px;height:29px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:white}.tray svg{width:16px;height:16px}
#windows{position:absolute;z-index:4;inset:calc(42px + env(safe-area-inset-top)) 0 calc(62px + env(safe-area-inset-bottom));pointer-events:none}.window{position:absolute;pointer-events:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,calc(100% - 28px));height:min(510px,calc(100% - 20px));min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid #ffffff30;border-radius:16px;background:rgba(22,26,41,.96);box-shadow:0 25px 80px #0007;backdrop-filter:blur(24px)}.window.max{width:calc(100% - 16px);height:calc(100% - 16px)}.window.minimized{display:none}.titlebar{height:45px;flex:none;display:flex;align-items:center;padding:0 11px;border-bottom:1px solid #ffffff17}.window-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650}.controls{margin-left:auto;display:flex;gap:7px}.controls button{width:26px;height:26px;border:0;border-radius:50%;background:#ffffff18;color:white}.controls .close:hover{background:#e95168}.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:15px}.muted{color:var(--muted)}.field{width:100%;min-width:0;padding:10px;border:1px solid #ffffff24;border-radius:9px;background:#ffffff12;color:white}.field::placeholder{color:#aeb5ca}.row{display:flex;align-items:center;gap:8px}.row .field{flex:1}.primary,.secondary{padding:9px 12px;border-radius:9px;color:white}.primary{border:0;background:var(--accent)}.secondary{border:1px solid #ffffff20;background:#ffffff12}.panel,.result{padding:13px;border:1px solid #ffffff17;border-radius:12px;background:#ffffff0b}.result{margin-top:12px}.note{width:100%;height:100%;min-height:160px;resize:none;border:0;outline:0;background:transparent;color:white;line-height:1.6}.calc{max-width:320px;margin:auto}.calc-display{margin-bottom:9px;text-align:right;font-size:27px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc-grid button{height:46px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff10;color:white}.calc-grid .accent{background:#8c78f0}.list{display:grid;gap:8px;margin-top:12px}.task-row,.file-row{display:flex;align-items:center;gap:9px;padding:9px;border-radius:9px;background:#ffffff0c}.task-row span{flex:1}.task-row.done span{text-decoration:line-through;color:var(--muted)}.task-row input{accent-color:var(--accent)}.file-row svg{flex:none}.file-row button{margin-left:auto}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center}.calendar span{padding:7px 2px;border-radius:8px}.calendar .day-name{color:#b7bfd6;font-size:12px}.calendar .today{background:var(--accent)}.settings-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff17}.settings-item select{max-width:150px;padding:8px;border:1px solid #ffffff25;border-radius:8px;background:#292c43;color:white}.focus{text-align:center;padding:18px 4px}.focus-time{font-size:clamp(44px,12vw,64px);font-variant-numeric:tabular-nums}.sketch{height:100%;min-height:170px;display:flex;flex-direction:column;gap:9px}.canvas{width:100%;flex:1;min-height:120px;border-radius:9px;background:#f8f8fb;touch-action:none}.menu{position:absolute;z-index:12;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(380px,calc(100% - 20px));max-height:calc(var(--app-height) - 145px - env(safe-area-inset-top));overflow:auto;padding:15px;border:1px solid #ffffff28;border-radius:17px;background:#161b2bef;backdrop-filter:blur(24px)}.menu.hidden{display:none}.menu-head{display:flex;justify-content:space-between;margin-bottom:12px}.menu-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.menu-app{padding:10px 4px;border:0;border-radius:10px;background:transparent;color:white;font-size:12px}.menu-app:hover{background:#ffffff18}.menu-app svg{display:block;margin:0 auto 6px}.toast{position:absolute;z-index:15;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;padding:10px 14px;border:1px solid #ffffff25;border-radius:11px;background:#171c2eee;white-space:nowrap;font-size:13px}
@media(max-width:700px){.topbar{font-size:12px}.top-right{gap:7px}.welcome{top:31%;right:16px;max-width:72%}.welcome h1{font-size:clamp(39px,11vw,56px)}.welcome p{font-size:13px}.welcome time{font-size:12px}.desktop-icons{display:none}.taskbar{height:calc(56px + env(safe-area-inset-bottom));justify-content:flex-start;gap:4px;padding:0 calc(92px + env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left))}.dock-button{width:36px;height:36px;border-radius:11px}.dock-apps{gap:3px}.dock-apps .dock-button:nth-child(n+5){display:none}.separator{margin:0 1px}.tray{right:max(4px,env(safe-area-inset-right));gap:1px}.tray button{width:24px}.tray #clock{font-size:11px}#windows{inset:calc(42px + env(safe-area-inset-top)) 0 calc(56px + env(safe-area-inset-bottom))}.window{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:13px}.window.max{width:calc(100% - 6px);height:calc(100% - 6px)}.content{padding:12px}.menu{bottom:calc(62px + env(safe-area-inset-bottom));max-height:calc(var(--app-height) - 130px - env(safe-area-inset-top))}}
@media(max-width:370px){.dock-apps .dock-button:nth-child(n+4){display:none}.taskbar{padding-right:calc(88px + env(safe-area-inset-right))}.top-right span:first-child{display:none}}
@media(max-height:500px) and (max-width:700px){.welcome{top:14%;right:12px}.welcome h1{font-size:35px}.welcome p{font-size:12px}.welcome time{margin-top:6px}.taskbar{height:calc(48px + env(safe-area-inset-bottom))}#windows{inset:calc(38px + env(safe-area-inset-top)) 0 calc(48px + env(safe-area-inset-bottom))}.dock-button{width:33px;height:33px}}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
<symbol id="mark" viewBox="0 0 24 24"><path d="M6 19V5h7a5 5 0 0 1 0 10H6m7 0 5 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="notes" viewBox="0 0 24 24"><path d="M7 3h8l5 5v13H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm8 0v5h5M8 13h8m-8 4h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="files" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm0 3h18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="browser" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
<symbol id="calculator" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 6h8v4H8zM8 14h1m3 0h1m3 0h1M8 18h1m3 0h1m3 0h1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="tasks" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6M5 4h6m-6 16h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
<symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 3v4M8 3v4M3 10h18m-13 4h2m4 0h2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="focus" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 8v5l3 2M9 2h6m-3 0v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="sketch" viewBox="0 0 24 24"><path d="m4 16 10-10 4 4L8 20H4v-4Zm8-8 4 4M14 4l2-2 5 5-2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19 13.5a7 7 0 0 0 0-3l1.5-1.2-1.5-2.6-1.8.7a7 7 0 0 0-2.6-1.5L14.3 4h-3l-.4 1.9a7 7 0 0 0-2.6 1.5l-1.8-.7L5 9.3l1.5 1.2a7 7 0 0 0 0 3L5 14.7l1.5 2.6 1.8-.7a7 7 0 0 0 2.6 1.5l.4 1.9h3l.4-1.9a7 7 0 0 0 2.6-1.5l1.8.7 1.5-2.6L19 13.5Z" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="wifi" viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0m-9 3a4 4 0 0 1 6 0m-3 4h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
<symbol id="sound" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4Zm12-2a6 6 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<section id="boot"><div class="boot-inner"><div class="brand"><svg><use href="#mark"/></svg></div><div class="boot-title">Launching Portprin Operation System…</div><div class="boot-sub">Un spațiu simplu pentru tot ce faci.</div><div class="progress"><i></i></div><div class="boot-status">Se pregătește spațiul tău de lucru</div></div></section>
<main id="desktop">
  <header class="topbar">
    <div>
      <button id="openMenu"><svg style="width:15px;height:15px;vertical-align:-2px"><use href="#mark"/></svg> Portprin</button>
      <span id="activeName">Desktop</span>
    </div>
    <div class="top-right"><span>● Conectat</span><span id="topClock">--:--</span></div>
  </header>
  <nav class="desktop-icons" id="desktopIcons"></nav>
  <section class="welcome"><h1>Bine ai<br>revenit.</h1><p>Ziua ta, ideile tale, toate într-un loc.</p><time id="date"></time></section>
  <section id="windows"></section>
  <section class="menu hidden" id="menu"><div class="menu-head"><b>Toate aplicațiile</b><span class="muted">Portprin OS</span></div><input class="field" id="searchApps" placeholder="Caută aplicații…"><div class="menu-apps" id="menuApps"></div></section>
  <footer class="taskbar"><button class="dock-button start" id="startButton" aria-label="Aplicații"><svg><use href="#mark"/></svg></button><span class="separator"></span><div class="dock-apps" id="dockApps"></div><div class="tray"><button id="wifi" aria-label="Stare rețea"><svg><use href="#wifi"/></svg></button><button id="sound" aria-label="Sunet"><svg><use href="#sound"/></svg></button><span id="clock">--:--</span></div></footer>
</main>
<script>
const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`,apps={notes:{name:'Notițe',desk:1,dock:1},files:{name:'Fișiere',desk:1,dock:1},browser:{name:'Browser',desk:1,dock:1},calculator:{name:'Calculator',desk:1,dock:1},tasks:{name:'Sarcini',dock:1},calendar:{name:'Calendar',dock:1},focus:{name:'Focus',dock:1},sketch:{name:'Schițe'},settings:{name:'Setări'}};
const desktop=document.querySelector('#desktop'),windows=document.querySelector('#windows'),menu=document.querySelector('#menu');
function fit(){
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-height', h + 'px');
}
fit();
window.addEventListener('resize', fit);
window.visualViewport && window.visualViewport.addEventListener('resize', fit);

function clock(){let n=new Date(),t=n.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});document.querySelector('#clock').textContent=t;document.querySelector('#topClock').textContent=t;document.querySelector('#date').textContent=n.toLocaleDateString('ro-RO',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}clock();setInterval(clock,15000);
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(id){
  if(id==='notes')return `<div class="panel" style="height:100%;display:flex;flex-direction:column"><div class="muted">Notița se salvează automat pe acest dispozitiv.</div><textarea class="note" placeholder="Începe să scrii…"></textarea></div>`;
  if(id==='calculator')return `<div class="calc"><input class="field calc-display" readonly placeholder="0"><div class="calc-grid">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(x=>`<button data-key="${x}" class="${['÷','×','−','+','='].includes(x)?'accent':''}">${x}</button>`).join('')}</div></div>`;
  if(id==='files')return `<h2>Fișierele mele</h2><div class="list">${[['Bun venit.txt','Un salut de la Portprin.'],['Idei.txt','Un loc pentru următoarea ta idee.'],['Primii pași.txt','Încearcă aplicațiile Portprin.']].map(([n,t])=>`<div class="file-row">${icon('files')}<span>${n}</span><button class="secondary" data-file="${t}">Deschide</button></div>`).join('')}</div><div class="result" id="preview">Alege un fișier pentru previzualizare.</div>`;
  if(id==='browser')return `<h2>Internetul, la îndemână.</h2><p class="muted">Caută pe web sau introdu adresa unui site.</p><form class="row" id="webForm"><input class="field" id="query" placeholder="Caută sau introdu o adresă…" required><button class="primary">Deschide</button></form><div class="result"><b>Legături rapide</b><p><button class="secondary" data-url="https://www.wikipedia.org">Wikipedia</button> <button class="secondary" data-url="https://www.openstreetmap.org">OpenStreetMap</button> <button class="secondary" data-url="https://developer.mozilla.org">MDN</button></p></div>`;
  if(id==='tasks')return `<h2>Sarcinile mele</h2><form class="row" id="taskForm"><input class="field" id="taskInput" placeholder="Adaugă o sarcină…" maxlength="120" required><button class="primary">Adaugă</button></form><div class="list" id="taskList"></div>`;
  if(id==='calendar'){let n=new Date(),first=new Date(n.getFullYear(),n.getMonth(),1).getDay(),count=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();return `<h2>${n.toLocaleDateString('ro-RO',{month:'long',year:'numeric'})}</h2><div class="calendar">${['Du','Lu','Ma','Mi','Jo','Vi','Sâ'].map(d=>`<span class="day-name">${d}</span>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:count},(_,i)=>`<span class="${i+1===n.getDate()?'today':''}">${i+1}</span>`).join('')}</div>`}
  if(id==='focus')return `<div class="focus"><h2>Timp de concentrare</h2><p class="muted">Ia lucrurile pe rând. Tu poți.</p><div class="focus-time" data-time>25:00</div><p class="muted" data-status>Pregătit pentru o sesiune</p><button class="primary" data-toggle>Pornește</button> <button class="secondary" data-reset>Resetează</button><p><button class="secondary" data-min="25">25 min</button> <button class="secondary" data-min="5">5 min pauză</button></p></div>`;
  if(id==='sketch')return `<div class="sketch"><div class="row" style="flex-wrap:wrap"><b style="margin-right:auto">Planșă de desen</b><button class="secondary" data-color="#202338">●</button><button class="secondary" data-color="#7257df">●</button><button class="secondary" data-color="#d54b70">●</button><button class="secondary" data-clear>Șterge</button><button class="secondary" data-save>Salvează</button></div><canvas class="canvas"></canvas></div>`;
  return `<h2>Personalizează Portprin</h2><div class="panel"><div class="settings-item"><b>Fundal</b><select id="wallpaper"><option value="default">Albastru de noapte</option><option value="aurora">Auroră</option><option value="sunset">Apus</option></select></div><div class="settings-item"><b>Sunet</b><button class="secondary" id="soundSetting">Activ</button></div><div class="settings-item"><b>Despre Portprin</b>${icon('settings')}</div></div>`;
}
function focus(w){document.querySelectorAll('.window').forEach(x=>x.style.zIndex=3);w.style.zIndex=4}
function openApp(id){menu.classList.add('hidden');document.querySelector('#activeName').textContent=apps[id].name;let w=document.querySelector(`[data-window="${id}"]`);if(w){w.classList.remove('minimized');focus(w);return}w=document.createElement('section');w.className='window';w.dataset.window=id;w.innerHTML=`<div class="titlebar"><div class="window-title">${icon(id)}${apps[id].name}</div><div class="controls"><button data-min aria-label="Minimize">−</button><button data-max aria-label="Maximize">□</button><button class="close" data-close aria-label="Close">×</button></div></div><div class="content">${render(id)}</div>`;windows.append(w);w.addEventListener('pointerdown',()=>focus(w));w.querySelector('[data-close]').onclick=()=>{w.remove();document.querySelector('#activeName').textContent='Desktop'};w.querySelector('[data-min]').onclick=()=>w.classList.add('minimized');w.querySelector('[data-max]').onclick=()=>w.classList.toggle('max');wire(id,w)}
function wire(id,w){
  if(id==='notes'){let a=w.querySelector('textarea');a.value=localStorage.getItem('portprin-note')||'';a.oninput=()=>localStorage.setItem('portprin-note',a.value)}
  if(id==='calculator'){let d=w.querySelector('.calc-display'),x='';w.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='C')x='';else if(k==='⌫')x=x.slice(0,-1);else if(k==='±')x=x.startsWith('-')?x.slice(1):'-'+x;else if(k==='='){try{let s=x.replace(/[×÷−]/g,c=>({'×':'*','÷':'/','−':'-'}[c]));if(!/^[0-9+*/().%\s-]+$/.test(s))throw 0;let r=Function('"use strict";return ('+s+')')();if(!Number.isFinite(r))throw 0;x=String(Math.round((r+Number.EPSILON)*1e10)/1e10)}catch{x='Eroare'}}else x+=k;d.value=x||'0'})}
  if(id==='files')w.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>w.querySelector('#preview').textContent=b.dataset.file);
  if(id==='browser'){w.querySelector('#webForm').onsubmit=e=>{e.preventDefault();let q=w.querySelector('#query').value.trim(),url=/^https?:\/\//i.test(q)?q:/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(q)?'https://'+q:'https://www.google.com/search?q='+encodeURIComponent(q);window.open(url,'_blank','noopener,noreferrer')};w.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank','noopener,noreferrer'))}
  if(id==='tasks'){let refresh=()=>{let a=read('portprin-tasks',[]);w.querySelector('#taskList').innerHTML=a.map((t,i)=>`<div class="task-row ${t.done?'done':''}"><input type="checkbox" data-check="${i}" ${t.done?'checked':''}><span>${esc(t.text)}</span><button class="secondary" data-remove="${i}">×</button></div>`).join('')||'<p class="muted">Lista e goală. Adaugă prima sarcină.</p>';w.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let a=read('portprin-tasks',[]);a[+c.dataset.check].done=c.checked;save('portprin-tasks',a);refresh()});w.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let a=read('portprin-tasks',[]);a.splice(+b.dataset.remove,1);save('portprin-tasks',a);refresh()})};w.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();let i=w.querySelector('#taskInput'),a=read('portprin-tasks',[]);a.push({text:i.value.trim(),done:false});save('portprin-tasks',a);i.value='';refresh()};refresh()}
  if(id==='settings'){let s=w.querySelector('#wallpaper');s.value=localStorage.getItem('portprin-wallpaper')||'default';applyWallpaper(s.value);s.onchange=()=>{localStorage.setItem('portprin-wallpaper',s.value);applyWallpaper(s.value)};let b=w.querySelector('#soundSetting');b.textContent=localStorage.getItem('portprin-sound')==='off'?'Dezactivat':'Activ';b.onclick=()=>{let off=localStorage.getItem('portprin-sound')!=='off';localStorage.setItem('portprin-sound',off?'off':'on');b.textContent=off?'Dezactivat':'Activ';document.querySelector('#sound').style.opacity=off?'.4':'1'}}
  if(id==='focus'){let sec=1500,timer=null,t=w.querySelector('[data-time]'),toggle=w.querySelector('[data-toggle]'),status=w.querySelector('[data-status]'),draw=()=>t.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');toggle.onclick=()=>{if(timer){clearInterval(timer);timer=null;toggle.textContent='Continuă';status.textContent='Sesiune oprită'}else{toggle.textContent='Pauză';status.textContent='Concentrează-te';timer=setInterval(()=>{if(sec){sec--;draw()}else{clearInterval(timer);timer=null;toggle.textContent='Pornește';status.textContent='Sesiune încheiată'}},1000)}};w.querySelector('[data-reset]').onclick=()=>{clearInterval(timer);timer=null;sec=1500;draw();toggle.textContent='Pornește';status.textContent='Pregătit pentru o sesiune'};w.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{clearInterval(timer);timer=null;sec=+b.dataset.min*60;draw();toggle.textContent='Pornește';status.textContent='Pregătit pentru o sesiune'})}
  if(id==='sketch'){let c=w.querySelector('canvas'),ctx=c.getContext('2d'),drawing=false,color='#202338';let resize=()=>{let r=c.getBoundingClientRect();c.width=Math.max(1,r.width*devicePixelRatio);c.height=Math.max(1,r.height*devicePixelRatio);ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=3;ctx.lineCap='round'};requestAnimationFrame(resize);new ResizeObserver(resize).observe(c);c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);let r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};c.onpointermove=e=>{if(drawing){let r=c.getBoundingClientRect();ctx.strokeStyle=color;ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()}};c.onpointerup=c.onpointercancel=()=>drawing=false;w.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>color=b.dataset.color);w.querySelector('[data-clear]').onclick=()=>ctx.clearRect(0,0,c.width,c.height);w.querySelector('[data-save]').onclick=()=>{let a=document.createElement('a');a.download='portprin-sketch.png';a.href=c.toDataURL();a.click()}}}
}
function applyWallpaper(v){desktop.classList.remove('aurora','sunset');if(v==='aurora'||v==='sunset')desktop.classList.add(v)}
for(let [id,a] of Object.entries(apps)){if(a.desk){let b=document.createElement('button');b.className='desktop-icon';b.innerHTML=`<span class="icon-tile">${icon(id)}</span><span>${a.name}</span>`;b.onclick=()=>openApp(id);document.querySelector('#desktopIcons').append(b)}if(a.dock){let b=document.createElement('button');b.className='dock-button';b.title=apps[id].name;b.setAttribute('aria-label',apps[id].name);b.innerHTML=icon(id);b.onclick=()=>openApp(id);document.querySelector('#dockApps').append(b)}}
function toggleMenu(){menu.classList.toggle('hidden')}document.querySelector('#startButton').onclick=toggleMenu;document.querySelector('#openMenu').onclick=toggleMenu;document.querySelector('#wifi').onclick=()=>toast('Ești conectat la rețea.');document.querySelector('#sound').onclick=()=>{let off=localStorage.getItem('portprin-sound')!=='off';localStorage.setItem('portprin-sound',off?'off':'on');document.querySelector('#sound').style.opacity=off?'.4':'1'};function fill(q=''){let root=document.querySelector('#menuApps');root.innerHTML=Object.entries(apps).filter(([,a])=>a.name.toLowerCase().includes(q.toLowerCase())).map(([id,a])=>`<button class="menu-app" data-app="${id}">${icon(id)}${a.name}</button>`).join('');root.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app))}fill();document.querySelector('#searchApps').oninput=e=>fill(e.target.value);function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;desktop.append(t);setTimeout(()=>t.remove(),2000)}applyWallpaper(localStorage.getItem('portprin-wallpaper')||'default');setTimeout(()=>document.querySelector('#boot').classList.add('done'),5000);
</script>
</body>
</html>
