<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101524">
  <title>Portprin OS</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f8ff;background:#101524;font-synthesis:none;--accent:#9d8cff;--glass:rgba(21,27,45,.84)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    #boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#20274c 0,#111626 48%,#090d17 100%);transition:opacity .55s ease,visibility .55s}.boot-inner{text-align:center;width:min(380px,85vw)}.brand-mark{width:72px;height:72px;margin:0 auto 24px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#b3a5ff,#705ee7);box-shadow:0 12px 55px #8472ff55;font-size:38px;font-weight:800;color:#fff}.boot-title{font-size:clamp(20px,4vw,27px);font-weight:650;letter-spacing:.01em}.boot-sub{color:#aab1c9;margin:10px 0 28px}.progress{height:4px;background:#ffffff20;border-radius:9px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:#a99aff;animation:load 5s linear forwards}.boot-status{font-size:12px;color:#929ab4;margin-top:12px}@keyframes load{to{width:100%}}#boot.done{opacity:0;visibility:hidden;pointer-events:none}
    #desktop{height:100vh;min-height:520px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 78% 18%,#6971c8 0,transparent 35%),radial-gradient(ellipse at 15% 82%,#275d83 0,transparent 42%),linear-gradient(135deg,#15192b,#27304e 55%,#161d32);transition:background .3s}.wallpaper-aurora{background:radial-gradient(ellipse at 75% 12%,#bd8de5 0,transparent 35%),radial-gradient(ellipse at 12% 80%,#257e87 0,transparent 43%),linear-gradient(135deg,#17152d,#293858 55%,#171d34)!important}.wallpaper-sunset{background:radial-gradient(ellipse at 76% 18%,#faad78 0,transparent 36%),radial-gradient(ellipse at 10% 85%,#a54b78 0,transparent 48%),linear-gradient(135deg,#362042,#593957 60%,#22203c)!important}
    .topbar{height:42px;position:absolute;z-index:5;left:0;right:0;top:0;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#1015245c;backdrop-filter:blur(16px);font-size:13px}.top-left,.top-right{display:flex;gap:18px;align-items:center}.top-brand{font-weight:750;letter-spacing:.02em}.top-button{border:0;background:transparent;padding:6px;border-radius:8px}.top-button:hover{background:#ffffff19}.desktop-icons{position:absolute;top:64px;left:20px;display:grid;grid-template-columns:repeat(1,82px);gap:10px}.desktop-icon{width:76px;padding:8px 4px;border:1px solid transparent;border-radius:12px;text-align:center;background:transparent;color:#fff;text-shadow:0 1px 5px #0009}.desktop-icon:hover,.desktop-icon:focus{background:#ffffff20;border-color:#ffffff20}.app-icon{height:44px;width:44px;margin:0 auto 6px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ffffff38,#ffffff13);backdrop-filter:blur(10px);font-size:23px;box-shadow:0 5px 16px #0002}.desktop-icon span:last-child{font-size:12px}.welcome{position:absolute;right:6vw;top:23%;text-align:right;max-width:480px;text-shadow:0 3px 20px #0004}.welcome h1{font-size:clamp(38px,6vw,72px);line-height:1;margin:0 0 12px;letter-spacing:-.055em}.welcome p{color:#e0e5f7;font-size:16px;margin:0}.welcome .date-line{font-size:14px;color:#d0d7ed;margin-top:22px}
    .taskbar{position:absolute;z-index:8;bottom:0;left:0;right:0;height:66px;display:flex;align-items:center;justify-content:center;gap:9px;background:#111626a8;backdrop-filter:blur(20px);border-top:1px solid #ffffff1b}.dock-button{width:45px;height:45px;border:0;border-radius:14px;background:#ffffff12;font-size:22px;transition:transform .16s,background .16s}.dock-button:hover{transform:translateY(-5px);background:#ffffff27}.dock-button.start{background:var(--accent);font-weight:800}.dock-separator{height:30px;width:1px;background:#ffffff30;margin:0 3px}.dock-running{position:absolute;bottom:4px;width:5px;height:3px;border-radius:5px;background:#d1c9ff}.tray{position:absolute;right:18px;display:flex;gap:12px;align-items:center;font-size:13px}.tray button{background:transparent;border:0;padding:8px;border-radius:8px}.tray button:hover{background:#ffffff19}
    .window{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,calc(100vw - 28px));height:min(510px,calc(100vh - 120px));min-height:280px;background:var(--glass);border:1px solid #ffffff30;border-radius:16px;box-shadow:0 25px 80px #0007;backdrop-filter:blur(24px);overflow:hidden;display:flex;flex-direction:column;animation:appear .18s ease}.window.maximized{width:calc(100vw - 24px);height:calc(100vh - 120px);top:52%;}.window.hidden{display:none}@keyframes appear{from{opacity:0;scale:.97}to{opacity:1;scale:1}}.titlebar{height:48px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #ffffff17;cursor:grab}.window-title{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px}.window-controls{margin-left:auto;display:flex;gap:7px}.window-controls button{width:27px;height:27px;border:0;border-radius:50%;background:#ffffff18}.window-controls button:hover{background:#ffffff32}.window-controls .close:hover{background:#ff6170}.window-content{padding:18px;overflow:auto;flex:1}.panel{background:#ffffff0b;border:1px solid #ffffff17;border-radius:13px;padding:15px}.muted{color:#b4bbd1}.app-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.launch-card{min-height:112px;text-align:left;border:1px solid #ffffff1d;border-radius:14px;background:#ffffff0b;padding:15px;transition:.15s}.launch-card:hover{background:#ffffff17;transform:translateY(-2px)}.launch-card b{display:block;margin:10px 0 4px}.launch-card small{color:#b4bbd1}.primary{background:var(--accent)!important;border:0!important;color:#fff;padding:10px 14px;border-radius:9px}.secondary{background:#ffffff12;border:1px solid #ffffff20;padding:9px 12px;border-radius:9px}.field{width:100%;color:#fff;background:#ffffff12;border:1px solid #ffffff24;border-radius:9px;padding:10px}.field::placeholder{color:#aeb5ca}.row{display:flex;gap:9px;align-items:center}.row .field{flex:1}.note-area{width:100%;height:100%;min-height:220px;resize:none;color:#f7f8ff;background:transparent;border:0;outline:0;line-height:1.6}.note-area:focus{outline:0}.calc{max-width:330px;margin:0 auto}.calc-display{width:100%;padding:16px;text-align:right;font-size:30px;margin-bottom:12px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-grid button{height:52px;border:1px solid #ffffff18;background:#ffffff10;border-radius:11px;font-size:18px}.calc-grid button:hover{background:#ffffff25}.calc-grid .accent{background:#8c78f0}.file-list,.task-list{display:grid;gap:8px;margin-top:14px}.file-row,.task-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#ffffff0c}.file-row button:last-child{margin-left:auto}.task-row span{flex:1}.task-row.done span{text-decoration:line-through;color:#aab1c9}.task-row input{accent-color:var(--accent)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-top:14px}.calendar span{padding:8px 2px;border-radius:8px}.calendar .day-name{color:#b7bfd6;font-size:12px}.calendar .today{background:var(--accent);font-weight:700}.browser-result{padding:17px;border-radius:11px;background:#ffffff0c;margin-top:16px}.settings-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff17}.settings-item select{background:#292c43;color:white;border:1px solid #ffffff25;border-radius:8px;padding:8px}.toast{position:absolute;z-index:12;left:50%;bottom:82px;transform:translateX(-50%);background:#171c2eea;border:1px solid #ffffff25;padding:10px 15px;border-radius:11px;box-shadow:0 8px 28px #0005;font-size:13px;animation:appear .15s ease}.menu{position:absolute;z-index:10;bottom:76px;left:50%;transform:translateX(-50%);width:min(370px,calc(100vw - 24px));padding:16px;background:#161b2beF;border:1px solid #ffffff28;border-radius:18px;box-shadow:0 20px 60px #0007;backdrop-filter:blur(24px)}.menu.hidden{display:none}.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.menu .field{margin-bottom:12px}.menu-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.menu-app{border:0;background:transparent;border-radius:10px;padding:11px 5px;font-size:12px}.menu-app:hover{background:#ffffff18}.menu-app span{display:block;font-size:22px;margin-bottom:5px}
    @media(max-width:600px){.topbar{padding:0 11px}.top-left,.top-right{gap:9px}.desktop-icons{left:10px;top:60px}.welcome{right:18px;top:38%;max-width:70%}.welcome p{font-size:14px}.welcome h1{font-size:48px}.taskbar{justify-content:flex-start;padding-left:12px;gap:6px}.dock-button{width:40px;height:40px}.tray{right:8px;gap:2px}.tray button{padding:6px}.window{height:min(500px,calc(100vh - 105px))}.window-content{padding:14px}}
  </style>
</head>
<body>
  <section id="boot" aria-label="Portprin is starting">
    <div class="boot-inner"><div class="brand-mark">P</div><div class="boot-title">Launching Portprin Operation System…</div><div class="boot-sub">A simpler space for everything you do.</div><div class="progress"><span></span></div><div class="boot-status">Preparing your workspace</div></div>
  </section>
  <main id="desktop" aria-label="Portprin desktop">
    <header class="topbar"><div class="top-left"><button class="top-button top-brand" id="topStart" aria-label="Open applications">◈ Portprin</button><span id="activeName">Desktop</span></div><div class="top-right"><span>◉ Online</span><span id="topClock">--:--</span></div></header>
    <nav class="desktop-icons" aria-label="Desktop applications">
      <button class="desktop-icon" data-app="notes"><span class="app-icon">📝</span><span>Notes</span></button>
      <button class="desktop-icon" data-app="files"><span class="app-icon">📁</span><span>Files</span></button>
      <button class="desktop-icon" data-app="browser"><span class="app-icon">🌐</span><span>Browser</span></button>
      <button class="desktop-icon" data-app="calculator"><span class="app-icon">🧮</span><span>Calculator</span></button>
    </nav>
    <section class="welcome"><h1>Good to see<br>you.</h1><p>Your day, your ideas, all in one place.</p><div class="date-line" id="welcomeDate"></div></section>
    <section id="windows" aria-live="polite"></section>
    <section id="startMenu" class="menu hidden" aria-label="Application launcher"><div class="menu-head"><strong>All applications</strong><span class="muted">Portprin OS</span></div><input id="appSearch" class="field" placeholder="Search applications…" autocomplete="off"><div class="menu-apps"></div></section>
    <footer class="taskbar" aria-label="Dock"><button class="dock-button start" id="startButton" aria-label="Applications">P</button><span class="dock-separator"></span><button class="dock-button" data-app="notes" title="Notes">📝</button><button class="dock-button" data-app="files" title="Files">📁</button><button class="dock-button" data-app="browser" title="Browser">🌐</button><button class="dock-button" data-app="calculator" title="Calculator">🧮</button><button class="dock-button" data-app="tasks" title="Tasks">✅</button><button class="dock-button" data-app="calendar" title="Calendar">📅</button><button class="dock-button" data-app="settings" title="Settings">⚙️</button><div class="tray"><button id="wifi" title="Network status">◉</button><button id="sound" title="Sound">🔊</button><span id="clock">--:--</span></div></footer>
  </main>
<script>
  const apps={notes:{name:'Notes',icon:'📝',description:'Capture thoughts and keep them saved.'},files:{name:'Files',icon:'📁',description:'Browse your Portprin starter files.'},browser:{name:'Browser',icon:'🌐',description:'Search the web or enter a website.'},calculator:{name:'Calculator',icon:'🧮',description:'Quick calculations, whenever you need them.'},tasks:{name:'Tasks',icon:'✅',description:'Make a list and keep your day on track.'},calendar:{name:'Calendar',icon:'📅',description:'See today and plan ahead.'},settings:{name:'Settings',icon:'⚙️',description:'Make your workspace feel like yours.'}};
  const desktop=document.querySelector('#desktop'), windows=document.querySelector('#windows'), menu=document.querySelector('#startMenu');
  const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
  function updateClock(){const now=new Date(),time=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});document.querySelector('#clock').textContent=time;document.querySelector('#topClock').textContent=time;document.querySelector('#welcomeDate').textContent=now.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'})}updateClock();setInterval(updateClock,15000);
  function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
  function launch(name){menu.classList.add('hidden');document.querySelector('#activeName').textContent=apps[name].name;let existing=document.querySelector(`[data-window="${name}"]`);if(existing){existing.classList.remove('hidden');existing.style.zIndex=4;return}const win=document.createElement('section');win.className='window';win.dataset.window=name;win.innerHTML=`<div class="titlebar"><div class="window-title"><span>${apps[name].icon}</span>${apps[name].name}</div><div class="window-controls"><button data-minimize aria-label="Minimize">−</button><button data-maximize aria-label="Maximize">□</button><button class="close" data-close aria-label="Close">×</button></div></div><div class="window-content">${renderApp(name)}</div>`;windows.append(win);win.addEventListener('pointerdown',()=>{document.querySelectorAll('.window').forEach(w=>w.style.zIndex=3);win.style.zIndex=4});win.querySelector('[data-close]').onclick=()=>{win.remove();document.querySelector('#activeName').textContent='Desktop'};win.querySelector('[data-minimize]').onclick=()=>win.classList.add('hidden');win.querySelector('[data-maximize]').onclick=()=>win.classList.toggle('maximized');wireApp(name,win);}
  function renderApp(name){if(name==='notes')return `<div class="panel" style="height:100%"><div class="muted" style="margin-bottom:10px">Your note is saved automatically on this device.</div><textarea class="note-area" placeholder="Start writing…" aria-label="Your note"></textarea></div>`;
    if(name==='calculator')return `<div class="calc"><input class="field calc-display" aria-label="Calculator display" placeholder="0" readonly><div class="calc-grid">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(x=>`<button class="${['÷','×','−','+','='].includes(x)?'accent':''}" data-key="${x}">${x}</button>`).join('')}</div></div>`;
    if(name==='files')return `<h2 style="margin:0 0 5px">My files</h2><p class="muted">A few useful things to get started.</p><div class="file-list">${[['📄','Welcome.txt','A quick hello from Portprin.'],['🗒️','Ideas.txt','A space for your next big idea.'],['📋','Getting started.txt','Open Notes, add a task, or personalize Settings.']].map(([i,n,t])=>`<div class="file-row"><span>${i}</span><span style="flex:1">${n}</span><button class="secondary" data-file="${t}">Open</button></div>`).join('')}</div><div class="browser-result" id="filePreview">Choose a file to preview it here.</div>`;
    if(name==='browser')return `<h2 style="margin:0 0 6px">A little more of the web.</h2><p class="muted">Search the web or enter a website address.</p><form class="row" id="searchForm"><input class="field" id="webQuery" placeholder="Search or enter an address…" required><button class="primary">Go</button></form><div class="browser-result"><b>Quick links</b><div class="row" style="flex-wrap:wrap;margin-top:12px"><button class="secondary" data-url="https://www.wikipedia.org">Wikipedia</button><button class="secondary" data-url="https://www.openstreetmap.org">OpenStreetMap</button><button class="secondary" data-url="https://developer.mozilla.org">MDN Web Docs</button></div><p class="muted" style="font-size:12px;margin:14px 0 0">External links open in a new tab.</p></div>`;
    if(name==='tasks'){const tasks=read('portprin-tasks',[]);return `<h2 style="margin:0 0 5px">Today's tasks</h2><p class="muted">Small steps add up.</p><form class="row" id="taskForm"><input class="field" id="taskInput" placeholder="Add a task…" maxlength="120" required><button class="primary">Add</button></form><div class="task-list">${tasks.map((t,i)=>`<div class="task-row ${t.done?'done':''}"><input type="checkbox" data-task-check="${i}" ${t.done?'checked':''} aria-label="Mark ${escapeHtml(t.text)} complete"><span>${escapeHtml(t.text)}</span><button class="secondary" data-task-remove="${i}" aria-label="Remove task">×</button></div>`).join('')||'<p class="muted">Nothing on your list yet. Add your first task above.</p>'}</div>`}
    if(name==='calendar'){const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate(),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return `<h2 style="margin:0">${now.toLocaleDateString([], {month:'long',year:'numeric'})}</h2><p class="muted">A fresh page, every day.</p><div class="calendar">${names.map(d=>`<span class="day-name">${d}</span>`).join('')}${Array.from({length:first},()=>'<span></span>').join('')}${Array.from({length:count},(_,i)=>`<span class="${i+1===now.getDate()?'today':''}">${i+1}</span>`).join('')}</div>`}
    return `<h2 style="margin:0 0 4px">Make it yours</h2><p class="muted">Your choices are saved on this device.</p><div class="panel"><div class="settings-item"><div><b>Wallpaper</b><div class="muted" style="font-size:12px">Choose a desktop color mood</div></div><select id="wallpaper"><option value="default">Midnight blue</option><option value="aurora">Aurora</option><option value="sunset">Sunset</option></select></div><div class="settings-item"><div><b>Sound</b><div class="muted" style="font-size:12px">Toggle the sound indicator</div></div><button class="secondary" id="soundSetting">🔊 On</button></div><div class="settings-item"><div><b>About Portprin</b><div class="muted" style="font-size:12px">A simpler space for everything you do.</div></div><span>✦</span></div></div>`;
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function wireApp(name,win){if(name==='notes'){const area=win.querySelector('textarea');area.value=localStorage.getItem('portprin-note')||'';area.oninput=()=>localStorage.setItem('portprin-note',area.value)}
    if(name==='calculator'){const display=win.querySelector('.calc-display');let expr='';win.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const key=b.dataset.key;if(key==='C')expr='';else if(key==='⌫')expr=expr.slice(0,-1);else if(key==='±')expr=expr.startsWith('-')?expr.slice(1):'-'+expr;else if(key==='='){try{const safe=expr.replace(/[×÷−]/g,c=>({'×':'*','÷':'/','−':'-'}[c]));if(!/^[0-9+*/().%\s-]+$/.test(safe))throw Error();const result=Function('"use strict";return ('+safe+')')();if(!Number.isFinite(result))throw Error();expr=String(Math.round((result+Number.EPSILON)*1e10)/1e10)}catch{expr='Error'}}else expr+=key;display.value=expr||'0'})}
    if(name==='files')win.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>win.querySelector('#filePreview').textContent=b.dataset.file);
    if(name==='browser'){win.querySelector('#searchForm').onsubmit=e=>{e.preventDefault();let q=win.querySelector('#webQuery').value.trim();if(!q)return;let url=/^https?:\/\//i.test(q)?q:/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(q)?'https://'+q:'https://www.google.com/search?q='+encodeURIComponent(q);window.open(url,'_blank','noopener,noreferrer')};win.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank','noopener,noreferrer'))}
    if(name==='tasks'){const refresh=()=>{const current=read('portprin-tasks',[]);win.querySelector('.task-list').innerHTML=current.map((t,i)=>`<div class="task-row ${t.done?'done':''}"><input type="checkbox" data-task-check="${i}" ${t.done?'checked':''} aria-label="Mark ${escapeHtml(t.text)} complete"><span>${escapeHtml(t.text)}</span><button class="secondary" data-task-remove="${i}" aria-label="Remove task">×</button></div>`).join('')||'<p class="muted">Nothing on your list yet. Add your first task above.</p>';win.querySelectorAll('[data-task-check]').forEach(c=>c.onchange=()=>{let a=read('portprin-tasks',[]);a[+c.dataset.taskCheck].done=c.checked;save('portprin-tasks',a);refresh()});win.querySelectorAll('[data-task-remove]').forEach(b=>b.onclick=()=>{let a=read('portprin-tasks',[]);a.splice(+b.dataset.taskRemove,1);save('portprin-tasks',a);refresh()})};win.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();let input=win.querySelector('#taskInput'),a=read('portprin-tasks',[]);a.push({text:input.value.trim(),done:false});save('portprin-tasks',a);input.value='';refresh()};refresh()}
    if(name==='settings'){const select=win.querySelector('#wallpaper');select.value=localStorage.getItem('portprin-wallpaper')||'default';applyWallpaper(select.value);select.onchange=()=>{save('portprin-wallpaper',select.value);applyWallpaper(select.value)};const sound=win.querySelector('#soundSetting');sound.textContent=localStorage.getItem('portprin-sound')==='off'?'🔇 Off':'🔊 On';sound.onclick=()=>{const off=localStorage.getItem('portprin-sound')!=='off';localStorage.setItem('portprin-sound',off?'off':'on');sound.textContent=off?'🔇 Off':'🔊 On';document.querySelector('#sound').textContent=off?'🔇':'🔊'}}
  }
  function applyWallpaper(value){desktop.classList.remove('wallpaper-aurora','wallpaper-sunset');if(value==='aurora')desktop.classList.add('wallpaper-aurora');if(value==='sunset')desktop.classList.add('wallpaper-sunset')}
  document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>launch(b.dataset.app)));document.querySelector('#startButton').onclick=()=>menu.classList.toggle('hidden');document.querySelector('#topStart').onclick=()=>menu.classList.toggle('hidden');document.querySelector('#wifi').onclick=()=>toast('You are connected.');document.querySelector('#sound').onclick=()=>{const off=localStorage.getItem('portprin-sound')!=='off';localStorage.setItem('portprin-sound',off?'off':'on');document.querySelector('#sound').textContent=off?'🔇':'🔊'};
  const menuApps=document.querySelector('.menu-apps');function fillMenu(filter=''){menuApps.innerHTML=Object.entries(apps).filter(([,a])=>a.name.toLowerCase().includes(filter.toLowerCase())).map(([id,a])=>`<button class="menu-app" data-menu-app="${id}"><span>${a.icon}</span>${a.name}</button>`).join('');menuApps.querySelectorAll('[data-menu-app]').forEach(b=>b.onclick=()=>launch(b.dataset.menuApp))}fillMenu();document.querySelector('#appSearch').oninput=e=>fillMenu(e.target.value);
  function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;desktop.append(el);setTimeout(()=>el.remove(),2200)}
  applyWallpaper(localStorage.getItem('portprin-wallpaper')||'default');setTimeout(()=>document.querySelector('#boot').classList.add('done'),5000);
</script>
</body>
</html>
