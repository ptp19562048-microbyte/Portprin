<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131e">
  <title>Portprin OS</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f5fb;background:#10131e;font-synthesis:none;--accent:#a391ff;--glass:rgba(22,26,41,.93);--line:#ffffff20;--muted:#aeb5ca}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{min-height:100svh}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.hidden{display:none!important}
    #boot{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#242544,#111522 55%,#090c13);transition:opacity .55s,visibility .55s}.boot-inner{width:min(380px,84vw);text-align:center}.brand-mark{width:70px;height:70px;margin:0 auto 25px;display:grid;place-items:center;border:1px solid #ffffff36;border-radius:22px;background:linear-gradient(145deg,#b2a5ff,#6654d9);box-shadow:0 12px 55px #8472ff55}.brand-mark svg{width:37px;height:37px}.boot-title{font-size:clamp(20px,4vw,27px);font-weight:680;letter-spacing:-.02em}.boot-sub{margin:10px 0 28px;color:#aab1c9}.progress{height:4px;overflow:hidden;border-radius:9px;background:#ffffff20}.progress span{display:block;width:0;height:100%;background:#b4a7ff;animation:load 5s linear forwards}.boot-status{margin-top:12px;color:#929ab4;font-size:12px}@keyframes load{to{width:100%}}#boot.done{opacity:0;visibility:hidden;pointer-events:none}
    #desktop{position:relative;width:100%;height:100%;height:100svh;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 78% 15%,#6872bd 0,transparent 36%),radial-gradient(ellipse at 12% 84%,#245c78 0,transparent 43%),linear-gradient(135deg,#15192b,#27304e 55%,#161d32);transition:background .3s}.wallpaper-aurora{background:radial-gradient(ellipse at 75% 12%,#bd8de5 0,transparent 35%),radial-gradient(ellipse at 12% 80%,#257e87 0,transparent 43%),linear-gradient(135deg,#17152d,#293858 55%,#171d34)!important}.wallpaper-sunset{background:radial-gradient(ellipse at 76% 18%,#faad78 0,transparent 36%),radial-gradient(ellipse at 10% 85%,#a54b78 0,transparent 48%),linear-gradient(135deg,#362042,#593957 60%,#22203c)!important}
    .topbar{position:absolute;z-index:6;inset:0 0 auto;height:42px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;background:#10152466;backdrop-filter:blur(16px);font-size:13px}.top-left,.top-right{display:flex;align-items:center;gap:16px}.top-brand{font-weight:750;letter-spacing:.03em}.top-button{border:0;background:transparent;padding:6px;border-radius:8px}.top-button:hover,.tray button:hover{background:#ffffff19}.desktop-icons{position:absolute;top:58px;left:15px;bottom:78px;display:grid;grid-template-columns:repeat(1,76px);grid-auto-rows:82px;gap:5px;align-content:start}.desktop-icon{width:72px;padding:7px 3px;border:1px solid transparent;border-radius:12px;text-align:center;background:transparent;color:#fff;text-shadow:0 1px 5px #0009}.desktop-icon:hover,.desktop-icon:focus{background:#ffffff20;border-color:#ffffff20}.icon-tile{width:43px;height:43px;margin:0 auto 5px;display:grid;place-items:center;border:1px solid #ffffff25;border-radius:14px;background:linear-gradient(145deg,#ffffff36,#ffffff10);backdrop-filter:blur(10px);box-shadow:0 5px 16px #0002}.icon-tile svg{width:22px;height:22px}.desktop-icon span:last-child{font-size:11px}
    .welcome{position:absolute;right:7vw;top:24%;max-width:480px;text-align:right;text-shadow:0 3px 20px #0004;pointer-events:none}.welcome h1{margin:0 0 12px;font-size:clamp(38px,6vw,72px);line-height:1;letter-spacing:-.055em}.welcome p{margin:0;color:#e0e5f7;font-size:16px}.welcome .date-line{margin-top:22px;color:#d0d7ed;font-size:14px}
    .taskbar{position:absolute;z-index:8;inset:auto 0 0;height:66px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 170px;background:#111626b8;backdrop-filter:blur(20px);border-top:1px solid #ffffff1b}.dock-button{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid transparent;border-radius:14px;background:#ffffff12;transition:transform .16s,background .16s}.dock-button svg{width:21px;height:21px}.dock-button:hover{transform:translateY(-4px);background:#ffffff27}.dock-button.start{background:var(--accent);font-weight:800;font-size:18px}.dock-separator{height:29px;width:1px;flex:none;background:#ffffff30;margin:0 2px}.dock-running{position:absolute;bottom:2px;width:5px;height:3px;border-radius:5px;background:#d1c9ff}.tray{position:absolute;right:13px;display:flex;align-items:center;gap:7px;font-size:12px}.tray button{width:31px;height:31px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent}.tray svg{width:16px;height:16px}.menu{position:absolute;z-index:12;left:50%;bottom:74px;transform:translateX(-50%);width:min(380px,calc(100vw - 24px));max-height:calc(100svh - 135px);overflow:auto;padding:16px;background:#161b2bef;border:1px solid #ffffff28;border-radius:18px;box-shadow:0 20px 60px #0007;backdrop-filter:blur(24px)}.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.menu .field{margin-bottom:12px}.menu-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.menu-app{border:0;background:transparent;border-radius:10px;padding:10px 5px;font-size:12px}.menu-app:hover{background:#ffffff18}.menu-app svg{display:block;width:22px;height:22px;margin:0 auto 7px}
    #windows{position:absolute;inset:42px 0 66px;z-index:4;pointer-events:none}.window{position:absolute;pointer-events:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,calc(100vw - 32px));height:min(510px,calc(100% - 24px));min-height:min(260px,calc(100% - 24px));background:var(--glass);border:1px solid #ffffff30;border-radius:16px;box-shadow:0 25px 80px #0007;backdrop-filter:blur(24px);overflow:hidden;display:flex;flex-direction:column;animation:appear .18s ease}.window.maximized{width:calc(100% - 20px);height:calc(100% - 20px)}@keyframes appear{from{opacity:0;scale:.97}to{opacity:1;scale:1}}.titlebar{height:46px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #ffffff17;cursor:grab}.window-title{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px}.window-title svg{width:18px;height:18px}.window-controls{margin-left:auto;display:flex;gap:7px}.window-controls button{width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:50%;background:#ffffff18;font-size:16px}.window-controls button:hover{background:#ffffff32}.window-controls .close:hover{background:#ff6170}.window-content{padding:17px;overflow:auto;overscroll-behavior:contain;flex:1;min-height:0}.panel{background:#ffffff0b;border:1px solid #ffffff17;border-radius:13px;padding:14px}.muted{color:var(--muted)}.app-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}.launch-card{min-height:112px;text-align:left;border:1px solid #ffffff1d;border-radius:14px;background:#ffffff0b;padding:15px;transition:.15s}.launch-card:hover{background:#ffffff17;transform:translateY(-2px)}.launch-card svg{width:22px;height:22px}.launch-card b{display:block;margin:10px 0 4px}.launch-card small{color:#b4bbd1}.primary{background:var(--accent)!important;border:0!important;color:#fff;padding:10px 14px;border-radius:9px}.secondary{background:#ffffff12;border:1px solid #ffffff20;padding:9px 12px;border-radius:9px}.field{width:100%;color:#fff;background:#ffffff12;border:1px solid #ffffff24;border-radius:9px;padding:10px}.field::placeholder{color:#aeb5ca}.row{display:flex;gap:9px;align-items:center}.row .field{flex:1}.note-area{width:100%;height:100%;min-height:180px;resize:none;color:#f7f8ff;background:transparent;border:0;outline:0;line-height:1.6}.note-area:focus{outline:0}.calc{max-width:330px;margin:0 auto}.calc-display{padding:14px;text-align:right;font-size:28px;margin-bottom:10px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc-grid button{height:48px;border:1px solid #ffffff18;background:#ffffff10;border-radius:11px;font-size:17px}.calc-grid button:hover{background:#ffffff25}.calc-grid .accent{background:#8c78f0}.file-list,.task-list{display:grid;gap:8px;margin-top:13px}.file-row,.task-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#ffffff0c}.file-row svg{width:17px;height:17px}.file-row button:last-child{margin-left:auto}.task-row span{flex:1}.task-row.done span{text-decoration:line-through;color:#aab1c9}.task-row input{accent-color:var(--accent)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-top:14px}.calendar span{padding:8px 2px;border-radius:8px}.calendar .day-name{color:#b7bfd6;font-size:12px}.calendar .today{background:var(--accent);font-weight:700}.browser-result{padding:15px;border-radius:11px;background:#ffffff0c;margin-top:14px}.settings-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #ffffff17}.settings-item select{background:#292c43;color:white;border:1px solid #ffffff25;border-radius:8px;padding:8px}.toast{position:absolute;z-index:15;left:50%;bottom:79px;transform:translateX(-50%);max-width:90vw;background:#171c2eea;border:1px solid #ffffff25;padding:10px 15px;border-radius:11px;box-shadow:0 8px 28px #0005;font-size:13px;white-space:nowrap;animation:appear .15s ease}.focus-display{text-align:center;padding:22px 10px}.focus-time{font-size:clamp(42px,10vw,64px);font-variant-numeric:tabular-nums;letter-spacing:-.04em}.focus-controls{display:flex;justify-content:center;gap:9px;margin-top:15px}.sketch-wrap{height:100%;min-height:200px;display:flex;flex-direction:column;gap:10px}.sketch-canvas{width:100%;flex:1;min-height:130px;border-radius:10px;background:#f8f8fb;touch-action:none;cursor:crosshair}.color-choice{width:28px;height:28px;border:2px solid #ffffff99;border-radius:50%;padding:0}.color-choice.active{outline:2px solid var(--accent);outline-offset:2px}
    @media(max-width:700px){.topbar{padding:0 10px}.top-left,.top-right{gap:8px}.topbar .top-left>span:not(#activeName){display:none}.welcome{right:18px;top:35%;max-width:72%}.welcome h1{font-size:clamp(40px,11vw,57px)}.welcome p{font-size:14px}.desktop-icons{left:7px;top:53px;grid-auto-rows:75px}.taskbar{height:58px;justify-content:flex-start;gap:5px;padding:0 112px 0 8px;overflow:hidden}.dock-button{width:38px;height:38px;border-radius:12px}.dock-button svg{width:19px;height:19px}.dock-separator{margin:0}.taskbar>[data-app="calendar"],.taskbar>[data-app="settings"]{display:none}.tray{right:6px;gap:2px}.tray button{width:27px}.tray #clock{font-size:11px}.menu{bottom:64px}.menu-apps{grid-template-columns:repeat(3,1fr)}#windows{inset:42px 0 58px}.window{width:calc(100% - 16px);height:calc(100% - 16px);max-height:calc(100% - 16px);min-height:0;border-radius:14px}.window.maximized{width:calc(100% - 8px);height:calc(100% - 8px)}.window-content{padding:13px}}
    @media(max-height:520px){.welcome{top:18%}.welcome h1{font-size:42px}.desktop-icons{grid-auto-rows:65px}.icon-tile{width:35px;height:35px}.icon-tile svg{width:18px;height:18px}.desktop-icon span:last-child{font-size:10px}.taskbar{height:52px}.dock-button{width:36px;height:36px}.window{height:calc(100% - 10px);min-height:0}#windows{inset:42px 0 52px}}
  </style>
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6 19V5h7a5 5 0 0 1 0 10H6m7 0 5 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M7 3h8l5 5v13H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm8 0v5h5M8 13h8m-8 4h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-files" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 10h18" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 6h8v4H8zM8 14h1m3 0h1m3 0h1M8 18h1m3 0h1m3 0h1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6M5 4h6m-6 16h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 3v4M8 3v4M3 10h18m-13 4h2m4 0h2m-8 3h2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.4-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.4-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1)" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 8v5l3 2M9 2h6m-3 0v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-draw" viewBox="0 0 24 24"><path d="m4 16 10-10 4 4L8 20H4v-4Zm8-8 4 4M14 4l2-2 5 5-2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0m-9 3a4 4 0 0 1 6 0m-3 4h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4Zm12-2a6 6 0 0 1 0 8m2-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>
  <section id="boot" aria-label="Portprin pornește"><div class="boot-inner"><div class="brand-mark"><svg><use href="#i-mark"/></svg></div><div class="boot-title">Launching Portprin Operation System…</div><div class="boot-sub">Un spațiu simplu pentru tot ce faci.</div><div class="progress"><span></span></div><div class="boot-status">Se pregătește spațiul tău de lucru</div></div></section>
  <main id="desktop" aria-label="Desktop Portprin">
    <header class="topbar"><div class="top-left"><button class="top-button top-brand" id="topStart" aria-label="Deschide aplicațiile"><svg style="width:15px;height:15px;vertical-align:-2px"><use href="#i-mark"/></svg> Portprin</button><span id="activeName">Desktop</span></div><div class="top-right"><span>● Conectat</span><span id="topClock">--:--</span></div></header>
    <nav class="desktop-icons" aria-label="Aplicații desktop"></nav>
    <section class="welcome"><h1>Bine ai<br>revenit.</h1><p>Ziua ta, ideile tale, toate într-un loc.</p><div class="date-line" id="welcomeDate"></div></section>
    <section id="windows" aria-live="polite"></section>
    <section id="startMenu" class="menu hidden" aria-label="Lansator de aplicații"><div class="menu-head"><strong>Toate aplicațiile</strong><span class="muted">Portprin OS</span></div><input id="appSearch" class="field" placeholder="Caută aplicații…" autocomplete="off"><div class="menu-apps"></div></section>
    <footer class="taskbar" aria-label="Dock"><button class="dock-button start" id="startButton" aria-label="Aplicații"><svg><use href="#i-mark"/></svg></button><span class="dock-separator"></span><div id="dockApps" style="display:flex;gap:7px"></div><div class="tray"><button id="wifi" title="Stare rețea" aria-label="Stare rețea"><svg><use href="#i-wifi"/></svg></button><button id="sound" title="Sunet" aria-label="Sunet"><svg><use href="#i-volume"/></svg></button><span id="clock">--:--</span></div></footer>
  </main>
<script>
  const iconIds={notes:'note',files:'files',browser:'web',calculator:'calc',tasks:'task',calendar:'calendar',focus:'focus',sketch:'draw',settings:'settings'};
  const icon=id=>`<svg aria-hidden="true"><use href="#i-${iconIds[id]||'mark'}"/></svg>`;
  const apps={notes:{name:'Notițe',description:'Păstrează ideile importante.',desktop:true,dock:true},files:{name:'Fișiere',description:'Deschide câteva fișiere de început.',desktop:true,dock:true},browser:{name:'Browser',description:'Caută pe web sau deschide un site.',desktop:true,dock:true},calculator:{name:'Calculator',description:'Calculează rapid expresii.',desktop:true,dock:true},tasks:{name:'Sarcini',description:'Organizează-ți pașii următori.',desktop:false,dock:true},calendar:{name:'Calendar',description:'Verifică data și planifică.',desktop:false,dock:true},focus:{name:'Focus',description:'Sesiuni de lucru cu temporizator.',desktop:false,dock:true},sketch:{name:'Schițe',description:'Desenează și salvează o idee.',desktop:false,dock:false},settings:{name:'Setări',description:'Personalizează spațiul de lucru.',desktop:false,dock:false}};
  const desktop=document.querySelector('#desktop'),windows=document.querySelector('#windows'),menu=document.querySelector('#startMenu');
  const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
  function updateClock(){const now=new Date(),time=now.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});document.querySelector('#clock').textContent=time;document.querySelector('#topClock').textContent=time;document.querySelector('#welcomeDate').textContent=now.toLocaleDateString('ro-RO',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}updateClock();setInterval(updateClock,15000);
  function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
  function renderApp(name){
    if(name==='notes')return `<div class="panel" style="height:100%;display:flex;flex-direction:column"><div class="muted" style="margin-bottom:10px">Notița se salvează automat pe acest dispozitiv.</div><textarea class="note-area" placeholder="Începe să scrii…" aria-label="Notița ta"></textarea></div>`;
    if(name==='calculator')return `<div class="calc"><input class="field calc-display" aria-label="Afișaj calculator" placeholder="0" readonly><div class="calc-grid">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(x=>`<button class="${['÷','×','−','+','='].includes(x)?'accent':''}" data-key="${x}">${x}</button>`).join('')}</div></div>`;
    if(name==='files')return `<h2 style="margin:0 0 5px">Fișierele mele</h2><p class="muted">Câteva lucruri utile pentru început.</p><div class="file-list">${[['Bun venit.txt','Un salut de la Portprin.'],['Idei.txt','Un loc pentru următoarea ta idee.'],['Primii pași.txt','Deschide Notițe, adaugă o sarcină sau personalizează Setările.']].map(([n,t])=>`<div class="file-row">${icon('files')}<span style="flex:1">${n}</span><button class="secondary" data-file="${t}">Deschide</button></div>`).join('')}</div><div class="browser-result" id="filePreview">Alege un fișier pentru previzualizare.</div>`;
    if(name==='browser')return `<h2 style="margin:0 0 6px">Internetul, la îndemână.</h2><p class="muted">Caută pe web sau introdu adresa unui site.</p><form class="row" id="searchForm"><input class="field" id="webQuery" placeholder="Caută sau introdu o adresă…" required><button class="primary">Deschide</button></form><div class="browser-result"><b>Legături rapide</b><div class="row" style="flex-wrap:wrap;margin-top:12px"><button class="secondary" data-url="https://www.wikipedia.org">Wikipedia</button><button class="secondary" data-url="https://www.openstreetmap.org">OpenStreetMap</button><button class="secondary" data-url="https://developer.mozilla.org">MDN Web Docs</button></div><p class="muted" style="font-size:12px;margin:14px 0 0">Legăturile externe se deschid într-o filă nouă.</p></div>`;
    if(name==='tasks'){const tasks=read('portprin-tasks',[]);return `<h2 style="margin:0 0 5px">Sarcinile mele</h2><p class="muted">Pașii mici contează.</p><form class="row" id="taskForm"><input class="field" id="taskInput" placeholder="Adaugă o sarcină…" maxlength="120" required><button class="primary">Adaugă</button></form><div class="task-list">${tasks.map((t,i)=>taskRow(t,i)).join('')||'<p class="muted">Lista e goală. Adaugă prima sarcină mai sus.</p>'}</div>`}
    if(name==='calendar'){const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate(),names=['Du','Lu','Ma','Mi','Jo','Vi','Sâ'];return `<h2 style="margin:0">${now.toLocaleDateString('ro-RO',{month:'long',year:'numeric'})}</h2><p class="muted">O pagină nouă, în fiecare zi.</p><div class="calendar">${names.map(d=>`<span class="day-name">${d}</span>`).join('')}${Array.from({length:first},()=>'<span></span>').join('')}${Array.from({length:count},(_,i)=>`<span class="${i+1===now.getDate()?'today':''}">${i+1}</span>`).join('')}</div>`}
    if(name==='focus')return `<div class="focus-display"><h2 style="margin:0 0 4px">Timp de concentrare</h2><p class="muted">Ia lucrurile pe rând. Tu poți.</p><div class="focus-time" data-focus-time>25:00</div><div class="muted" data-focus-status>Pregătit pentru o sesiune</div><div class="focus-controls"><button class="primary" data-focus-toggle>Pornește</button><button class="secondary" data-focus-reset>Resetează</button></div><div style="margin-top:20px"><button class="secondary" data-focus-duration="25">25 min</button> <button class="secondary" data-focus-duration="5">5 min pauză</button></div></div>`;
    if(name==='sketch')return `<div class="sketch-wrap"><div class="row" style="flex-wrap:wrap"><b style="margin-right:auto">Planșă de desen</b><button class="color-choice active" style="background:#202338" data-color="#202338" aria-label="Culoare închisă"></button><button class="color-choice" style="background:#7257df" data-color="#7257df" aria-label="Mov"></button><button class="color-choice" style="background:#d54b70" data-color="#d54b70" aria-label="Roz"></button><button class="color-choice" style="background:#338e75" data-color="#338e75" aria-label="Verde"></button><button class="secondary" data-clear>Șterge</button><button class="secondary" data-download>Salvează</button></div><canvas class="sketch-canvas" aria-label="Planșă de desen"></canvas></div>`;
    return `<h2 style="margin:0 0 4px">Personalizează Portprin</h2><p class="muted">Preferințele se salvează pe acest dispozitiv.</p><div class="panel"><div class="settings-item"><div><b>Fundal</b><div class="muted" style="font-size:12px">Alege atmosfera desktopului</div></div><select id="wallpaper"><option value="default">Albastru de noapte</option><option value="aurora">Auroră</option><option value="sunset">Apus</option></select></div><div class="settings-item"><div><b>Indicator sunet</b><div class="muted" style="font-size:12px">Activează sau dezactivează simbolul</div></div><button class="secondary" id="soundSetting">Activ</button></div><div class="settings-item"><div><b>Despre Portprin</b><div class="muted" style="font-size:12px">Un spațiu simplu pentru tot ce faci.</div></div>${icon('settings')}</div></div>`;
  }
  function taskRow(t,i){return `<div class="task-row ${t.done?'done':''}"><input type="checkbox" data-task-check="${i}" ${t.done?'checked':''} aria-label="Marchează sarcina ca terminată"><span>${escapeHtml(t.text)}</span><button class="secondary" data-task-remove="${i}" aria-label="Șterge sarcina">×</button></div>`}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function launch(name){menu.classList.add('hidden');document.querySelector('#activeName').textContent=apps[name].name;let existing=document.querySelector(`[data-window="${name}"]`);if(existing){existing.classList.remove('hidden');focusWindow(existing);return}const win=document.createElement('section');win.className='window';win.dataset.window=name;win.innerHTML=`<div class="titlebar"><div class="window-title">${icon(name)}${apps[name].name}</div><div class="window-controls"><button data-minimize aria-label="Minimizează">−</button><button data-maximize aria-label="Maximizează">□</button><button class="close" data-close aria-label="Închide">×</button></div></div><div class="window-content">${renderApp(name)}</div>`;windows.append(win);win.addEventListener('pointerdown',()=>focusWindow(win));win.querySelector('[data-close]').onclick=()=>{win.remove();document.querySelector('#activeName').textContent='Desktop'};win.querySelector('[data-minimize]').onclick=()=>win.classList.add('hidden');win.querySelector('[data-maximize]').onclick=()=>win.classList.toggle('maximized');wireApp(name,win)}
  function focusWindow(win){document.querySelectorAll('.window').forEach(w=>w.style.zIndex=3);win.style.zIndex=4}
  function wireApp(name,win){if(name==='notes'){const area=win.querySelector('textarea');area.value=localStorage.getItem('portprin-note')||'';area.oninput=()=>localStorage.setItem('portprin-note',area.value)}
    if(name==='calculator'){const display=win.querySelector('.calc-display');let expr='';win.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const key=b.dataset.key;if(key==='C')expr='';else if(key==='⌫')expr=expr.slice(0,-1);else if(key==='±')expr=expr.startsWith('-')?expr.slice(1):'-'+expr;else if(key==='='){try{const safe=expr.replace(/[×÷−]/g,c=>({'×':'*','÷':'/','−':'-'}[c]));if(!/^[0-9+*/().%\s-]+$/.test(safe))throw Error();const result=Function('"use strict";return ('+safe+')')();if(!Number.isFinite(result))throw Error();expr=String(Math.round((result+Number.EPSILON)*1e10)/1e10)}catch{expr='Eroare'}}else expr+=key;display.value=expr||'0'})}
    if(name==='files')win.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>win.querySelector('#filePreview').textContent=b.dataset.file);
    if(name==='browser'){win.querySelector('#searchForm').onsubmit=e=>{e.preventDefault();const q=win.querySelector('#webQuery').value.trim();if(!q)return;const url=/^https?:\/\//i.test(q)?q:/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(q)?'https://'+q:'https://www.google.com/search?q='+encodeURIComponent(q);window.open(url,'_blank','noopener,noreferrer')};win.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank','noopener,noreferrer'))}
    if(name==='tasks'){const refresh=()=>{const current=read('portprin-tasks',[]);win.querySelector('.task-list').innerHTML=current.map(taskRow).join('')||'<p class="muted">Lista e goală. Adaugă prima sarcină mai sus.</p>';win.querySelectorAll('[data-task-check]').forEach(c=>c.onchange=()=>{const a=read('portprin-tasks',[]);a[+c.dataset.taskCheck].done=c.checked;save('portprin-tasks',a);refresh()});win.querySelectorAll('[data-task-remove]').forEach(b=>b.onclick=()=>{const a=read('portprin-tasks',[]);a.splice(+b.dataset.taskRemove,1);save('portprin-tasks',a);refresh()})};win.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();const input=win.querySelector('#taskInput'),a=read('portprin-tasks',[]);a.push({text:input.value.trim(),done:false});save('portprin-tasks',a);input.value='';refresh()};refresh()}
    if(name==='settings'){const select=win.querySelector('#wallpaper');select.value=localStorage.getItem('portprin-wallpaper')||'default';applyWallpaper(select.value);select.onchange=()=>{save('portprin-wallpaper',select.value);applyWallpaper(select.value)};const sound=win.querySelector('#soundSetting');sound.textContent=localStorage.getItem('portprin-sound')==='off'?'Dezactivat':'Activ';sound.onclick=()=>{const off=localStorage.getItem('portprin-sound')!=='off';localStorage.setItem('portprin-sound',off?'off':'on');sound.textContent=off?'Dezactivat':'Activ';document.querySelector('#sound').style.opacity=off?'.45':'1'}}
    if(name==='focus'){let seconds=25*60,timer=null;const time=win.querySelector('[data-focus-time]'),status=win.querySelector('[data-focus-status]'),toggle=win.querySelector('[data-focus-toggle]');const render=()=>time.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');toggle.onclick=()=>{if(timer){clearInterval(timer);timer=null;toggle.textContent='Continuă';status.textContent='Sesiune oprită'}else{toggle.textContent='Pauză';status.textContent='Concentrează-te la un singur lucru';timer=setInterval(()=>{if(seconds>0){seconds--;render()}else{clearInterval(timer);timer=null;toggle.textContent='Pornește';status.textContent='Sesiune încheiată'}} ,1000)}};win.querySelector('[data-focus-reset]').onclick=()=>{clearInterval(timer);timer=null;seconds=25*60;render();toggle.textContent='Pornește';status.textContent='Pregătit pentru o sesiune'};win.querySelectorAll('[data-focus-duration]').forEach(b=>b.onclick=()=>{clearInterval(timer);timer=null;seconds=Number(b.dataset.focusDuration)*60;render();toggle.textContent='Pornește';status.textContent='Pregătit pentru o sesiune'})}
    if(name==='sketch'){const canvas=win.querySelector('canvas'),ctx=canvas.getContext('2d');let drawing=false,color='#202338';const resize=()=>{const rect=canvas.getBoundingClientRect(),data=canvas.width&&canvas.height?canvas.toDataURL():null;canvas.width=Math.max(1,Math.floor(rect.width*devicePixelRatio));canvas.height=Math.max(1,Math.floor(rect.height*devicePixelRatio));ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';if(data){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=data}};requestAnimationFrame(resize);new ResizeObserver(resize).observe(canvas);canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};canvas.onpointermove=e=>{if(!drawing)return;const r=canvas.getBoundingClientRect();ctx.strokeStyle=color;ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false;win.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;win.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x===b))});win.querySelector('[data-clear]').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);win.querySelector('[data-download]').onclick=()=>{const a=document.createElement('a');a.download='portprin-schita.png';a.href=canvas.toDataURL('image/png');a.click()}}
  }
  function applyWallpaper(value){desktop.classList.remove('wallpaper-aurora','wallpaper-sunset');if(value==='aurora')desktop.classList.add('wallpaper-aurora');if(value==='sunset')desktop.classList.add('wallpaper-sunset')}
  const desktopIcons=document.querySelector('.desktop-icons'),dockApps=document.querySelector('#dockApps');for(const [id,a] of Object.entries(apps)){if(a.desktop){const b=document.createElement('button');b.className='desktop-icon';b.innerHTML=`<span class="icon-tile">${icon(id)}</span><span>${a.name}</span>`;b.onclick=()=>launch(id);desktopIcons.append(b)}if(a.dock){const b=document.createElement('button');b.className='dock-button';b.title=a.name;b.setAttribute('aria-label',a.name);b.innerHTML=icon(id);b.onclick=()=>launch(id);dockApps.append(b)}}
  document.querySelector('#startButton').onclick=()=>menu.classList.toggle('hidden');document.querySelector('#topStart').onclick=()=>menu.classList.toggle('hidden');document.querySelector('#wifi').onclick=()=>toast('Ești conectat la rețea.');document.querySelector('#sound').onclick=()=>{const off=localStorage.getItem('portprin-sound')!=='off';localStorage.setItem('portprin-sound',off?'off':'on');document.querySelector('#sound').style.opacity=off?'.45':'1'};
  const menuApps=document.querySelector('.menu-apps');function fillMenu(filter=''){menuApps.innerHTML=Object.entries(apps).filter(([,a])=>a.name.toLowerCase().includes(filter.toLowerCase())).map(([id,a])=>`<button class="menu-app" data-menu-app="${id}">${icon(id)}${a.name}</button>`).join('');menuApps.querySelectorAll('[data-menu-app]').forEach(b=>b.onclick=()=>launch(b.dataset.menuApp))}fillMenu();document.querySelector('#appSearch').oninput=e=>fillMenu(e.target.value);
  function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;desktop.append(el);setTimeout(()=>el.remove(),2200)}
  applyWallpaper(localStorage.getItem('portprin-wallpaper')||'default');setTimeout(()=>document.querySelector('#boot').classList.add('done'),5000);
</script>
</body>
